<svg xmlns="http://www.w3.org/2000/svg" width="214" height="54" viewBox="0 0 214 54" role="img" aria-labelledby="title desc">
  <title id="title">LinkedIn profile badge</title>
  <desc id="desc">A matte rounded badge linking to Roshan Ravikumar on LinkedIn.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b58a9b"/>
      <stop offset="100%" stop-color="#8fb996"/>
    </linearGradient>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace; }
    </style>
  </defs>
  <rect x="1" y="1" width="212" height="52" rx="26" fill="#0e141a" stroke="url(#edge)" stroke-width="1.4"/>
  <rect x="7" y="7" width="200" height="40" rx="20" fill="#111820" opacity=".92"/>
  <circle cx="31" cy="27" r="15" fill="#b58a9b"/>
  <text class="sans" x="31" y="32" text-anchor="middle" font-size="13" font-weight="850" fill="#0e141a">in</text>
  <text class="sans" x="58" y="23" font-size="14" font-weight="760" fill="#f4efe7">LinkedIn</text>
  <text class="mono" x="58" y="38" font-size="11" fill="#a9a198">ross-r</text>
  <path d="M181 21l6 6-6 6" fill="none" stroke="#b58a9b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
